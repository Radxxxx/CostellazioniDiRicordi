<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Costellazioni di Ricordi</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <canvas id = "sky"></canvas>

        <div id = "controls">
            <h2>Aggiungi un Ricordo</h2>

            <div class = "buttons"></div>
                <button id="addMemoryBtn">Aggiungi</button>
                <button id="exportBtn">Esporta Costellazione</button>
            </div>
        </div>

          <script src="script.js"></script>
    </body>
</html>
