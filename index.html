<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=1024, user-scalable=yes">
    <meta charset="UTF-8">
    <title>Costellazioni dei Ricordi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
    <canvas id="sky"></canvas>

    <div id = "tooltip" class = "tooltip"></div>

    <div id="bottom-bar">
        <label for="memoryImage" id="addImageBtn">+</label>
        <input type="file" id="memoryImage" accept="image/*">
        <input type="text" id="memoryText" placeholder="Scrivi un ricordo...">
        <button id="addMemoryBtn">Invia</button>
        <button id="exportJsonBtn">Export JSON</button>
        <button id="importJsonBtn">Import JSON</button>
        <input type="file" id="importJsonFile" accept="application/json" style="display:none;">
    </div>

    <script src="script.js"></script>
</body>
</html>
